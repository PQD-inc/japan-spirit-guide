<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Spirit of Japan — Guest Guide</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f2ede4;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px 12px 40px}
.wrap{max-width:480px;width:100%}
.dots{display:flex;gap:5px;justify-content:center;padding:14px 0 10px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:#c5bfb3;cursor:pointer;border:none;transition:all .2s;flex-shrink:0}
.dot.on{background:#2c3e6b;transform:scale(1.3)}
.pg{display:none;animation:fi .3s ease}
.pg.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cover{background:#2c3e6b;border-radius:18px;padding:44px 28px 36px;text-align:center;box-shadow:0 4px 32px rgba(44,62,107,.18)}
.mon{width:64px;height:64px;margin:0 auto 22px;border:2px solid rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px}
.cv-l{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.4);margin-bottom:16px}
.cv-t{font-size:24px;font-weight:500;color:#fff;line-height:1.4;margin-bottom:6px}
.cv-s{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:24px;letter-spacing:1px}
.cv-p{font-size:14px;color:rgba(255,255,255,.72);line-height:2.05;margin-bottom:28px}
.lang-row{display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.lbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.7);font-size:12px;padding:7px 16px;border-radius:100px;cursor:pointer;transition:all .2s}
.lbtn:hover{background:rgba(255,255,255,.18)}
.lbtn.active{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.6);color:#fff;font-weight:500}
.sbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:13px;letter-spacing:2px;padding:12px 28px;border-radius:100px;cursor:pointer;transition:all .2s}
.sbtn:hover{background:rgba(255,255,255,.22)}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 20px rgba(0,0,0,.07);overflow:hidden}
.ch-hd{padding:26px 22px 16px;border-bottom:1px solid #f0ece6}
.ch-n{font-size:11px;letter-spacing:3px;color:#9a948a;margin-bottom:5px}
.ch-t{font-size:19px;font-weight:500;color:#1a1814;margin-bottom:4px;line-height:1.4}
.ch-s{font-size:12px;color:#9a948a}
.ch-bd{padding:18px 22px 22px}
.cb{background:#f7f4f0;border-radius:12px;padding:17px;margin-bottom:15px;font-size:14px;line-height:1.95;color:#4a453e}
.cb strong{color:#1a1814;font-weight:500}
.bl{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:15px}
.bl li{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:#4a453e;line-height:1.75}
.bi{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px}
.cl{border-left:3px solid;padding:13px 15px;border-radius:0 10px 10px 0;margin-bottom:15px;font-size:14px;line-height:1.9;color:#4a453e}
.cl strong{color:#1a1814;font-weight:500}
.yc{border-radius:10px;padding:14px;border:.5px solid}
.yc-t{font-size:11px;letter-spacing:2px;font-weight:500;margin-bottom:9px}
.yc-l{list-style:none;display:flex;flex-direction:column;gap:7px}
.yc-l li{font-size:13px;display:flex;gap:8px;align-items:flex-start;line-height:1.65}
.yc-l li::before{content:'→';flex-shrink:0}
.pnav{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 15px;border-top:1px solid #f0ece6}
.nb{background:transparent;border:1px solid #ddd;border-radius:100px;padding:8px 16px;font-size:12px;color:#6b6560;cursor:pointer;transition:all .2s}
.nb:hover{background:#f7f4f0}
.nb:disabled{opacity:.3;cursor:default}
.pi{font-size:12px;color:#9a948a}
/* Stamp */
.sp{padding:22px}
.sp-l{font-size:11px;letter-spacing:3px;color:#9a948a;margin-bottom:4px}
.sp-h{font-size:19px;font-weight:500;color:#1a1814;margin-bottom:6px}
.sp-s{font-size:13px;color:#9a948a;margin-bottom:20px;line-height:1.75}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.si{border:1.5px dashed #b0a898;border-radius:11px;padding:13px 10px;cursor:pointer;text-align:center;position:relative;background:#fff;transition:all .2s;-webkit-tap-highlight-color:transparent}
.si.on{border-style:solid;border-color:#2c3e6b;background:#e8eaf4}
.se{font-size:22px;margin-bottom:5px;display:block}
.sl{font-size:11px;color:#9a948a;line-height:1.4;display:block}
.si.on .sl{color:#2c3e6b}
.sc{position:absolute;top:6px;right:8px;font-size:13px;color:#2c3e6b;display:none}
.si.on .sc{display:block}
.more-btn{display:block;width:100%;background:#2c3e6b;color:#fff;border:none;border-radius:12px;padding:16px;font-size:14px;cursor:pointer;margin-bottom:16px;letter-spacing:1px;transition:all .2s}
.more-btn:hover{background:#3a5080}
.sr{text-align:center;padding:18px;background:#2c3e6b;border-radius:12px;display:none}
.sr.on{display:block}
.sr-t{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.5);margin-bottom:7px}
.sr-n{font-size:16px;font-weight:500;color:#fff;margin-bottom:7px;line-height:1.5}
.sr-m{font-size:13px;color:rgba(255,255,255,.7);line-height:1.85}
/* Final */
.fp{background:#2c3e6b;border-radius:18px;padding:40px 26px;text-align:center;box-shadow:0 4px 32px rgba(44,62,107,.18)}
.fp-l{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.38);margin-bottom:12px}
.fp-t{font-size:22px;font-weight:500;color:#fff;line-height:1.5;margin-bottom:8px}
.fp-e{font-size:12px;color:rgba(255,255,255,.32);margin-bottom:22px}
.fp-div{width:38px;height:1px;background:rgba(255,255,255,.2);margin:0 auto 22px}
.fp-p{font-size:14px;color:rgba(255,255,255,.72);line-height:2.05;margin:0 auto 26px;max-width:340px}
.kr{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.kw{border:1px solid rgba(255,255,255,.22);border-radius:100px;padding:5px 14px;font-size:12px;color:rgba(255,255,255,.62);letter-spacing:1px}
.ig{font-size:12px;color:rgba(255,255,255,.3);letter-spacing:2px}
.fp-nav{display:flex;justify-content:space-between;padding:14px 0 0}
.nb-inv{background:transparent;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.55);border-radius:100px;padding:8px 16px;font-size:12px;cursor:pointer}
.nb-inv:hover{background:rgba(255,255,255,.08)}
/* Detail guide */
.dg-wrap{background:#fff;border-radius:18px;box-shadow:0 2px 20px rgba(0,0,0,.07);overflow:hidden}
.dg-hd{padding:22px 22px 16px;border-bottom:1px solid #f0ece6;background:#2c3e6b}
.dg-hd-t{font-size:18px;font-weight:500;color:#fff;margin-bottom:4px}
.dg-hd-s{font-size:12px;color:rgba(255,255,255,.55)}
.dg-body{padding:0}
.dg-section{border-bottom:1px solid #f0ece6}
.dg-section:last-child{border-bottom:none}
.dg-acc{width:100%;background:transparent;border:none;padding:16px 22px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .2s}
.dg-acc:hover{background:#f7f4f0}
.dg-acc-t{font-size:14px;font-weight:500;color:#1a1814;display:flex;align-items:center;gap:10px}
.dg-acc-icon{font-size:20px;flex-shrink:0}
.dg-arrow{font-size:12px;color:#9a948a;transition:transform .2s;flex-shrink:0}
.dg-acc.open .dg-arrow{transform:rotate(180deg)}
.dg-content{display:none;padding:0 22px 18px}
.dg-content.open{display:block}
.dg-lead{font-size:14px;line-height:1.9;color:#4a453e;margin-bottom:14px}
.dg-lead strong{color:#1a1814;font-weight:500}
.dg-items{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.dg-items li{display:flex;gap:10px;font-size:13px;color:#4a453e;line-height:1.7;align-items:flex-start}
.dg-items li .tag{font-size:11px;background:#e8eaf4;color:#2c3e6b;border-radius:6px;padding:2px 8px;flex-shrink:0;margin-top:2px;font-weight:500}
.dg-items li .tag.ng{background:#faeae5;color:#c44a2e}
.dg-items li .tag.ok{background:#eaf2e0;color:#5a7a3a}
.dg-box{border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.8;margin-bottom:12px}
.dg-box.blue{background:#e8eaf4;color:#2c3e6b}
.dg-box.red{background:#faeae5;color:#c44a2e}
.dg-box.green{background:#eaf2e0;color:#5a7a3a}
.dg-box.gold{background:#fdf5e0;color:#c49a2a}
.phrase-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.phrase-card{background:#f7f4f0;border-radius:10px;padding:12px;text-align:center}
.phrase-jp{font-size:16px;font-weight:500;color:#1a1814;margin-bottom:3px}
.phrase-ro{font-size:11px;color:#9a948a;margin-bottom:5px}
.phrase-en{font-size:12px;color:#4a453e}
.dg-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 15px;border-top:1px solid #f0ece6}
</style>
</head>

      {n:'第1章',h:'「私」より「みんな」— 和（わ）',s:'Harmony',a:'#2c3e6b',al:'#e8eaf4',
       lead:'日本には古くから大切にされてきた価値観があります。それが<strong>「和」</strong>です。「自分が自由にしたい」よりも「周りの人が気持ちよく過ごせるか」を先に考える——その積み重ねが、日本の日常をつくっています。',
       bh:[['🚃','電車の中では静かに過ごす'],['🧍','誰も見ていなくても、きちんと列に並ぶ'],['🗑️','ゴミ箱がなければ、ゴミは自分で持ち帰る'],['🤫','住宅街や深夜は、声のトーンを落とす']],
       cl:'日本の街が清潔なのは清掃員が多いからではありません。一人ひとりが「自分のことは自分で」と思っているからです。<strong>それが「和」の、いちばん身近な姿です。</strong>',
       yc:['共有スペースでは声のボリュームを少し落としてみる','列があれば、最後尾に並ぶ','買ったお店でゴミを捨てる——それが日本人の基本的な考え方です']},
      {n:'第2章',h:'なぜゴミ箱が少ないの？',s:'自分のゴミは自分で持ち帰る',a:'#5a7a3a',al:'#eaf2e0',
       lead:'日本を訪れた外国人が最も驚くことのひとつが、<strong>街にゴミ箱がほとんどない</strong>こと。それでも街は清潔です。「自分が出したものは自分が責任を持つ」という考え方が文化として根づいているからです。',
       bh:[['🛍️','多くの日本人はゴミを持ち帰るための袋を携帯している'],['♻️','ゴミは燃えるゴミ・プラスチック・紙・瓶などに分別する'],['🧹','学校では生徒自身が教室を掃除する——清潔さは習慣として身につくもの']],
       cl:'美しい街並みは誰かが特別に維持しているわけではありません。何百万人もの人が毎日の小さな行動で守っているのです。<strong>あなたも今日から、その一員です。</strong>',
       yc:['小さな袋を持ち歩いて、ゴミは自分のバッグへ','どうしても途中で捨てたいときは、コンビニや飲食店のスタッフに一声かけてから','宿泊施設のゴミは分別方法に沿って——わからなければ施設のスタッフへ連絡を']},
      {n:'第3章',h:'おもてなし',s:'言葉にしなくても、相手のことを考える',a:'#4a8fa8',al:'#e4f2f7',
       lead:'「おもてなし」は「サービス」とは違います。相手が何を望んでいるかを言葉にされる前に察して自然に行動する——<strong>見返りを求めず、ただ相手のために動く心</strong>のことです。',
       bh:[['🏨','旅館のスタッフが、口に出していないのに好みを覚えている'],['🚄','新幹線の清掃員が車両に入るとき・出るときにお辞儀をする'],['🛬','空港のスタッフが指差しではなく一緒に目的地まで歩いてくれる']],
       cl:'おもてなしは仕事の義務ではなく心のあり方です。そのような心で迎えられたとき、<strong>静かに目を合わせて「ありがとうございます」と言う——それだけで十分な対話になります。</strong>',
       yc:['カフェを出るとき、椅子を少し整えてみる','ドアはそっと閉める','床のゴミを拾う——次の人へのおもてなしです','「ありがとう」をスタッフに伝えてみる']},
      {n:'第4章',h:'静けさは優しさ',s:'音を立てないことが、思いやりになる',a:'#2c3e6b',al:'#e8eaf4',
       lead:'日本人にとって静かにすることは「冷たさ」ではありません。<strong>「周りの人への配慮」</strong>です。音を立てないことが「あなたのことを気にかけています」という言葉のないメッセージになります。',
       bh:[['📵','電車内での通話は避ける——小声でも周囲には十分聞こえている'],['🌙','夜10時以降の住宅街では声のトーンを落とす'],['🏢','共用廊下やロビーでは静かに移動する']],
       cl:'この施設の周りには本当の生活があります。早起きのお年寄り、学校へ行く子ども、夜遅く帰ってくる人。<strong>あなたの「静けさ」が、その人たちへの贈り物になります。</strong>',
       yc:['夜10時以降は繁華街以外では声を落とす——住宅街や施設周辺は特に','通話は屋外か個室で','静けさをぜひ楽しんでください']},
      {n:'第5章',h:'靴を脱ぐ理由',s:'外と内を分ける、日本の結界',a:'#c44a2e',al:'#faeae5',
       lead:'靴を脱ぐのは清潔さだけのためではありません。玄関は<strong>「外（そと）」と「内（うち）」を分ける境界線</strong>です。その一線を越えることは、パブリックな世界からプライベートな聖域へ入ることを意味します。',
       bh:[['👟','玄関の段差で靴を脱ぎ、きれいに揃えて置く'],['🧦','室内用スリッパが用意されている場合は使用する'],['🏠','畳や木の床は「清浄な場所」として扱われている']],
       cl:'玄関で靴を脱ぐとき、それは単なるルールへの従順ではありません。<strong>「この空間を大切にします」という言葉のない宣言です。</strong>',
       yc:['玄関の段差（框）で靴を脱ぐ','脱いだ靴はつま先を外側に向けて揃える','スリッパはトイレ専用のものと使い分ける']},
      {n:'第6章',h:'温泉のルールはなぜある？',s:'温泉はお風呂ではなく、文化です',a:'#4a8fa8',al:'#e4f2f7',
       lead:'温泉はプールでもジャグジーでもありません。日本に古くから伝わる<strong>共同の儀式</strong>です。全員が気持ちよく過ごすためのルールが存在します。',
       bh:[['🚿','湯船に入る前にかけ湯または洗い場で体を洗う'],['🏊','タオルは湯船の中に入れない'],['🔇','会話は小声で'],['📵','浴室内での撮影・スマートフォンの使用は禁止']],
       cl:'温泉は日本文化のいちばん内側にある体験のひとつです。<strong>正しい心持ちで入れば——それだけで、ひとつの旅が完結します。</strong>',
       yc:['初めての場合はフロントで事前に確認を','ゆっくり入って、その静けさを持ち帰ってください']},
      {n:'第7章',h:'もったいない',s:'すべてのものに、価値がある',a:'#c49a2a',al:'#fdf5e0',
       lead:'<strong>「もったいない」</strong>は英語に直訳できない言葉です。食べ物・物・時間——それらを無駄にすることへの惜しむ気持ち。後悔と感謝と「すべてには価値がある」という信念が込められています。',
       bh:[['🍱','食事は残さず食べる——作った人への感謝がそこにある'],['🔧','物は壊れたら捨てるのではなく直す'],['💧','水や電気は使わないときは切る']],
       cl:'「もったいない」は日本の職人技が何世代も受け継がれる理由のひとつです。<strong>この感覚を少しでも持ち帰ってもらえれば、世界は少し変わるかもしれません。</strong>',
       yc:['食べられる量だけ注文する','部屋の備品は大切な贈り物を扱うように使う','出るときは照明を消す']},
      {n:'第8章',h:'あなたが泊まるのは地域の中です',s:'ここには、本当の生活があります',a:'#5a7a3a',al:'#eaf2e0',
       lead:'この施設の周りはホテル街ではありません。<strong>本当の人が、本当の日常を生きている場所です。</strong>朝学校へ向かう子ども。庭を手入れするお年寄り。夜遅く仕事から帰ってくる人。あなたは今、その日常の中に招かれています。',
       bh:[['👵','すれ違いにお辞儀をされたら——軽く頭を下げるだけで十分'],['🧒','この街の子どもたちは外国からの旅人を好奇心と開かれた心で見ています'],['🌿','街の清潔さ・静けさ・安心感はすべて地域の人たちが守り続けているもの']],
       cl:'丁寧に旅をする人は<strong>「旅行者」という存在のイメージを変えていきます。この街は、それを見ています。</strong>',
       yc:['お辞儀を返す','住宅街では声を落とす','笑顔で挨拶する——言葉がなくても伝わります']},
    ]

    chapters:[
      {n:'Chapter 1',h:'Harmony — 和 (Wa)',s:'"We" before "I"',a:'#2c3e6b',al:'#e8eaf4',lead:'Japan has a deep value at its core: <strong>Wa — harmony</strong>. It means choosing "how can I make those around me comfortable?" before "what do I want to do?"',bh:[['🚃','Keeping quiet on trains'],['🧍','Waiting in line even when no one watches'],['🗑️','Carrying litter when there is no bin'],['🤫','Lowering your voice late at night']],cl:'Japanese streets are pristine not because of more cleaners, but because everyone quietly takes responsibility for their own space. <strong>This is Wa in action.</strong>',yc:['Keep your voice low in shared spaces','Join the back of any queue you see','Dispose of rubbish at the shop where you bought it — that is the basic Japanese way of thinking']},
      {n:'Chapter 2',h:'Why so few bins?',s:'"I made this, so I take care of it"',a:'#5a7a3a',al:'#eaf2e0',lead:'Almost <strong>no public bins</strong> — yet the streets are spotless. The reason: "This is my trash, so I take responsibility for it."',bh:[['🛍️','Most carry a small bag for their own rubbish'],['♻️','Rubbish is sorted carefully'],['🧹','Children clean their own classrooms']],cl:'These pristine streets are maintained by millions of small invisible acts. <strong>You are now part of that story.</strong>',yc:['Carry a small bag and put your rubbish inside until you get back','If you really need to dispose of something on the way, ask a convenience store or restaurant staff first','For sorting guidance at your accommodation, contact the facility staff']},
      {n:'Chapter 3',h:'Omotenashi',s:'Anticipating what you need before you ask',a:'#4a8fa8',al:'#e4f2f7',lead:'Omotenashi means <strong>anticipating what someone needs before they ask</strong> — offering it without expecting anything in return.',bh:[['🏨','A ryokan attendant who remembers how you take your tea'],['🚄','Shinkansen cleaners who bow entering and exiting each car'],['🛬','Airport staff who walk you to your gate']],cl:'Omotenashi is a mindset, not a job. When served with this spirit, <strong>a sincere "arigatou" is the whole conversation.</strong>',yc:['Straighten your chair before leaving a café','Close doors quietly','Pick up litter — omotenashi for the next person','Say "arigatou" to staff today']},
      {n:'Chapter 4',h:'Silence is kindness',s:'Not making noise is a gift',a:'#2c3e6b',al:'#e8eaf4',lead:'Keeping quiet is not coldness — it is consideration. <strong>Not making noise says: "I am aware of you."</strong>',bh:[['📵','No phone calls on trains'],['🌙','Voices drop after 10 pm in residential areas'],['🏢','Move quietly in shared corridors']],cl:'Our neighbours share these walls. <strong>Your quiet presence is a gift to them and every traveller who follows.</strong>',yc:['After 10 pm, lower your voice outside busy entertainment areas — residential streets and around your accommodation especially','Step outside for phone calls','Enjoy the quiet — it is one of Japan\'s gifts']},
      {n:'Chapter 5',h:'Why we remove shoes',s:'The threshold between outside and inside',a:'#c44a2e',al:'#faeae5',lead:'The entrance marks the boundary between <strong>outside (soto) and inside (uchi)</strong> — from public world to sacred private space.',bh:[['👟','Remove shoes at the entrance step'],['🧦','Use provided slippers; separate ones for bathrooms'],['🏠','Tatami floors are treated as clean, sacred surfaces']],cl:'Removing your shoes says: <strong>"I respect this space."</strong>',yc:['Remove shoes before the entrance step','Place them neatly, facing the door','Keep bathroom slippers in the bathroom']},
      {n:'Chapter 6',h:'The onsen',s:'An ancient shared ritual',a:'#4a8fa8',al:'#e4f2f7',lead:'The onsen is one of Japan\'s oldest <strong>shared rituals</strong>. The customs exist so that everyone can feel comfortable.',bh:[['🚿','Wash your body before entering the water'],['🏊','Keep towel out of the bath'],['🔇','Speak quietly'],['📵','No phones or cameras']],cl:'Entering the onsen with the right heart <strong>is itself a form of travel.</strong>',yc:['Ask the front desk before your first visit','Enter slowly, carry the stillness with you']},
      {n:'Chapter 7',h:'Mottainai',s:'Everything has inherent worth',a:'#c49a2a',al:'#fdf5e0',lead:'<strong>Mottainai</strong> — deep sadness at waste. Food, objects, time. Regret, gratitude, and the belief that everything has value.',bh:[['🍱','Finish your meal — leaving food disrespects those who prepared it'],['🔧','Repair rather than discard'],['💧','Turn off lights and water when not in use']],cl:'<strong>To practice mottainai is to see the world differently.</strong>',yc:['Order only what you can finish','Handle room items with care','Turn off the lights when you leave']},

      {icon:'🏠',title:'榻榻米的礼仪',lead:'不要踩踏榻榻米的边框（花边）。这是日本重要的室内礼仪之一。',items:[{tag:'原因',text:'边框上历史上绣有家徽，踩踏被视为对家族的不敬'},{tag:'现代',text:'至今仍被认为是不懂礼仪的表现'},{tag:'注意',text:'和室是神圣场所——请穿袜子或赤脚进入'}],boxes:[{type:'green',text:'✓ 绕开边框行走，不要踩踏\n✓ 行李放在架子上，不要放在榻榻米上\n✓ 坐下时请正坐或盘腿'}]},
      {icon:'⛩️',title:'参拜神社和寺庙',lead:'神社和寺庙不只是观光地，也是当地人日常祈祷的神圣场所。',items:[{tag:'鸟居',text:'鸟居是通往神明世界的入口。经过时轻轻鞠躬，走两侧，中央是神明的通道'},{tag:'净手',text:'进入前在手水舍净手：右手→左手→漱口'},{tag:'参拜',text:'神社：二礼二拍手一礼。寺庙：合掌静默鞠躬'},{tag:'拍照',text:'本殿·佛像内通常禁止拍照，请务必确认标识'}],boxes:[{type:'blue',text:'📸 拍照前确认是否有「禁止摄影」的标识\n🔇 保持安静，不要大声喧哗或奔跑\n💰 轻轻将硬币放入奉纳箱，不要投掷'}]},
      {icon:'🛍️',title:'商店和餐厅礼仪',lead:'了解日本店铺的礼仪，让每次互动更加顺畅。',items:[{tag:'招呼',text:'招呼服务员时说「すみません」，同时轻轻举手并对视'},{tag:'付款',text:'将钱放在收银台的托盘上，不要直接递给收银员'},{tag:'小费',text:'日本没有给小费的文化。留下小费会让店员感到困惑'},{tag:'砍价',text:'日本基本是一口价，不习惯讨价还价'},{tag:'语言',text:'不会日语也没关系。指着菜单或使用翻译软件，对方会配合您'}],boxes:[{type:'green',text:'🗣️ 实用词汇\n・すみません——打招呼/道歉均可\n・これをください——请给我这个\n・いくらですか——多少钱？\n・ありがとう（阿里嘎多）——谢谢'}]},
      {icon:'🚃',title:'公共交通礼仪',lead:'电车和公交是日本日常生活的中心。遵守这些礼仪，融入当地生活。',items:[{tag:'优先席',text:'银色座位（优先席）为老人、孕妇、伤者保留，即使车厢不拥挤也不要坐'},{tag:'背包',text:'拥挤时将背包抱在胸前或放到行李架上'},{tag:'通话',text:'车内禁止打电话，注意耳机音量不要外漏'},{tag:'饮食',text:'除新干线外，尽量避免在车内饮食，尤其是气味较重的食物'},{tag:'上下车',text:'先下后上。门开后分站两侧等待，待乘客下车完毕再上车'}],boxes:[{type:'blue',text:'🎒 拥挤电车检查清单\n□ 背包抱在胸前\n□ 耳机没有外漏\n□ 未在打电话\n□ 在优先席附近将手机设为静音'}]},
      {icon:'🍱',title:'用餐礼仪',lead:'日本的饮食中蕴含着感恩的作法。',items:[{tag:'いただきます',text:'饭前说「いただきます」——感谢食物和制作它的人'},{tag:'ごちそうさま',text:'饭后说「ごちそうさまでした」——感谢厨师和食材'},{tag:'筷子禁忌',text:'不把筷子插在饭上（与祭祀有关）、不用筷子传递食物（葬礼习俗）、不用筷子拖拉餐具'},{tag:'剩饭',text:'尽量吃完——剩饭是「もったいない（可惜）」的行为'}],boxes:[{type:'gold',text:'🥢 如果筷子使用困难，可以这样说：\n「May I have a fork instead of chopsticks?」'}]},
      {icon:'💴',title:'金钱和购物礼仪',lead:'日本独特的付款方式，提前了解会更顺畅。',items:[{tag:'托盘',text:'在收银台将钱放在小托盘上，不要直接交到收银员手中'},{tag:'现金',text:'日本现金文化依然强烈，很多小店不接受信用卡'},{tag:'购物袋',text:'塑料袋需要付费（约2-5日元）。可以说「Bag not needed」'},{tag:'消费税',text:'消费税为10%，价格可能含税也可能不含，请确认'}],boxes:[{type:'blue',text:'💡 想确认是否可以刷卡时：\n→「Do you accept credit cards?」\n→ 拿出卡片说「Card, OK?」也能传达'}]},
      {icon:'🆘',title:'遇到困难时',lead:'做好准备，大多数旅行中的问题都可以冷静应对。',items:[{tag:'迷路',text:'寻找交番（派出所）——以蓝色灯笼为标志。警察会用地图为您指路'},{tag:'紧急',text:'救护车·消防：119。警察：110。可以用英语沟通'},{tag:'医院',text:'JNTO多语言服务热线：050-3816-2787（24小时）'},{tag:'遗失物',text:'护照遗失→联系大使馆。钱包遗失→去最近的交番。日本失物找回率极高'}],boxes:[{type:'red',text:'🚨 紧急联系方式\n・救护车·消防：119\n・警察：110\n・旅游咨询热线：050-3816-2787（24小时·多语言）'}],phrases:[{jp:'助けてください',ro:'Tasukete kudasai',en:'请帮帮我'},{jp:'迷いました',ro:'Mayoimashita',en:'我迷路了'},{jp:'病院はどこですか',ro:'Byōin wa doko?',en:'医院在哪里？'},{jp:'ありがとう',ro:'Arigatou',en:'谢谢'},{jp:'すみません',ro:'Sumimasen',en:'打扰一下'},{jp:'わかりません',ro:'Wakarimasen',en:'我不明白'}]}],
    chapters:[
      {n:'第一章',h:'「和」—— 先想到他人',s:'Harmony',a:'#2c3e6b',al:'#e8eaf4',lead:'日本有一个深植于文化中的价值观——<strong>「和」</strong>。相比起先考虑「我想怎样」，日本人更倾向于先考虑「周围的人舒适吗？」',bh:[['🚃','在电车上保持安静'],['🧍','即使没人看，也认真排队'],['🗑️','找不到垃圾桶时，自己把垃圾带走'],['🤫','在住宅区或深夜，降低说话声音']],cl:'日本的街道干净，不是因为有更多清洁工，而是每个人默默对自己负责。<strong>这就是「和」最贴近日常的样子。</strong>',yc:['在共享空间稍微降低声音','看到队伍就到最后排队','在购买商品的店铺丢弃垃圾——这是日本人的基本思考方式']},
      {n:'第二章',h:'为什么垃圾桶这么少？',s:'自己产生的垃圾，自己负责',a:'#5a7a3a',al:'#eaf2e0',lead:'街上<strong>几乎没有公共垃圾桶</strong>，但街道却非常干净。原因——「自己产生的垃圾，自己负责」已深入文化。',bh:[['🛍️','很多日本人随身携带小袋子'],['♻️','垃圾需按可燃垃圾、塑料、纸张等分类'],['🧹','学生自己打扫教室']],cl:'美丽的街道是数百万人每天的小行动共同守护的。<strong>您也是守护者中的一员。</strong>',yc:['随身携带一个小袋子，将垃圾放入自己的包中带走','如果途中实在需要丢弃，请先向便利店或餐厅的工作人员确认','住宿设施的垃圾请按分类方法处理——不明白的话请联系设施工作人员']},
      {n:'第三章',h:'款待之心 Omotenashi',s:'不需言语，也能感知对方的需求',a:'#4a8fa8',al:'#e4f2f7',lead:'「款待」不同于一般「服务」。<strong>在对方开口之前就察觉需求，不求回报地行动。</strong>',bh:[['🏨','旅馆服务员默默记住了您的喜好'],['🚄','新干线清洁员进出车厢时都会鞠躬'],['🛬','机场工作人员亲自带您走到目的地']],cl:'款待是心态，不是职责。<strong>真诚地说一声「谢谢」——这就是完整的交流。</strong>',yc:['离开咖啡馆时整理椅子','轻轻关门','捡起地上的垃圾','对服务员说「ありがとう」']},
      {n:'第四章',h:'安静是一种善意',s:'不发出声音，是对他人的体贴',a:'#2c3e6b',al:'#e8eaf4',lead:'保持安静不是「冷漠」，而是<strong>「对他人的体贴」</strong>。不制造噪音，是一种无声的信号。',bh:[['📵','在电车上避免打电话'],['🌙','夜间10点后，在住宅区降低声音'],['🏢','在共用走廊安静走动']],cl:'住宿设施周围有真实的生活。<strong>您的「安静」，是送给他们的礼物。</strong>',yc:['晚上10点以后，除繁华街道外请降低说话声音——住宅区和住宿设施周边尤其注意','打电话请到室外','请享受这份宁静']},
      {n:'第五章',h:'为什么要脱鞋？',s:'区分「外」与「内」的日本界限',a:'#c44a2e',al:'#faeae5',lead:'玄关是<strong>「外（公共）」与「内（私人）」的分界线</strong>。跨过这道线，意味着进入私人的神圣空间。',bh:[['👟','在玄关台阶处脱鞋并整齐摆放'],['🧦','如有提供室内拖鞋请穿上'],['🏠','榻榻米和木地板是「神圣且干净的地面」']],cl:'脱鞋是一种无声的表达：<strong>「我会珍视这个空间。」</strong>',yc:['在玄关台阶处脱鞋','鞋尖朝外整齐摆放','厕所拖鞋只在厕所内使用']},
      {n:'第六章',h:'温泉为什么有规定？',s:'温泉是文化，不只是泡澡',a:'#4a8fa8',al:'#e4f2f7',lead:'温泉是日本古老的<strong>共同仪式</strong>。这些规定是为了让所有人都能舒适地享受。',bh:[['🚿','进入前先在冲洗区清洗身体'],['🏊','毛巾不可放入浴池'],['🔇','请低声交谈'],['📵','禁止拍照和使用手机']],cl:'以正确的心态进入温泉，<strong>仅此一点，就能让这次旅行变得完整。</strong>',yc:['初次使用前请向前台咨询','慢慢浸泡，将这份宁静带走']},
      {n:'第七章',h:'もったいない——珍惜',s:'万物皆有其价值',a:'#c49a2a',al:'#fdf5e0',lead:'<strong>「もったいない（Mottainai·珍惜）」</strong>——对浪费食物、物品、时间的惋惜。蕴含遗憾、感谢与「万物皆有价值」的信念。',bh:[['🍱','吃完食物——剩饭是对厨师的不敬'],['🔧','修缮而非丢弃'],['💧','不用时关灯关水']],cl:'<strong>如果您能将这种感受带回自己的国家，世界或许会因此稍有改变。</strong>',yc:['只点自己能吃完的食物','像对待珍贵礼物一样使用房间物品','离开时关掉灯']},
      {n:'第八章',h:'您住的地方是社区的一部分',s:'这里，有真实的生活',a:'#5a7a3a',al:'#eaf2e0',lead:'<strong>真实的人，正在过着真实的日常生活。</strong>上学的孩子，打理小院的老人，深夜下班回家的人。',bh:[['👵','对方鞠躬时——轻轻点头回礼就足够'],['🧒','这条街上的孩子以好奇和开放的心看待旅人'],['🌿','街道的干净与安全感，都是社区居民共同守护的']],cl:'用心旅行的人，<strong>正在改变「旅行者」这一形象。这片街区，看到了这一切。</strong>',yc:['如果有人鞠躬，请回礼','在住宅区压低说话声音','微笑打招呼']},
    ]

let curLang='ja', curPage=0, showDetail=false;
const stampStates={ja:new Array(6).fill(false),en:new Array(6).fill(false),zh:new Array(6).fill(false),ko:new Array(6).fill(false)};

function setLang(code){curLang=code;curPage=0;showDetail=false;renderAll();window.scrollTo({top:0,behavior:'instant'});}

function setLangAndScroll(code){setLang(code);window.scrollTo({top:0,behavior:'instant'});}
function ts(si){
  stampStates[curLang][si]=!stampStates[curLang][si];
  document.getElementById('s'+si).classList.toggle('on',stampStates[curLang][si]);
  const allDone=stampStates[curLang].every(Boolean);
  const sr=document.getElementById('sr');
  if(sr) sr.classList.toggle('on',allDone);
}
function toggleAcc(el){
  el.classList.toggle('open');
  const content=el.nextElementSibling;
  content.classList.toggle('open');
}

function renderAll(){
  const L=LANGS[curLang];
  const total=L.chapters.length+3;

  // dots
  const dotsEl=document.getElementById('dots');
  dotsEl.innerHTML='';
  if(!showDetail){
    for(let i=0;i<total;i++){
      const d=document.createElement('button');
      d.className='dot'+(i===curPage?' on':'');
      d.onclick=(function(idx){return function(){go(idx);};})(i);
      dotsEl.appendChild(d);
    }
  }

  const c=document.getElementById('pgs');c.innerHTML='';

  if(showDetail){
    renderDetail(L,c);
    return;
  }

  // Cover
  const cover=document.createElement('div');
  cover.className='pg'+(curPage===0?' on':'');
  const lBtns=['en','zh','ko','ja'].map(lc=>`<button class="lbtn${curLang===lc?' active':''}" onclick="setLang('${lc}')">${LANGS[lc].label}</button>`).join('');
  cover.innerHTML=`<div class="cover"><div class="mon">⛩</div><div class="cv-l">${L.coverLabel}</div><div class="cv-t">${L.coverTitle}</div><div class="cv-s">${L.coverSub}</div><p class="cv-p">${L.coverP}</p><div class="lang-row">${lBtns}</div><button class="sbtn" onclick="go(1)">${L.startBtn}</button></div>`;
  c.appendChild(cover);

  // Chapters
  L.chapters.forEach((ch,ci)=>{
    const idx=ci+1;
    const p=document.createElement('div');
    p.className='pg'+(curPage===idx?' on':'');
    const bH=ch.bh.map(b=>`<li><span class="bi" style="background:${ch.al}">${b[0]}</span><span>${b[1]}</span></li>`).join('');
    const yH=ch.yc.map(y=>`<li>${y}</li>`).join('');
    p.innerHTML=`<div class="card"><div class="ch-hd"><div class="ch-n">${ch.n}</div><div class="ch-t">${ch.h}</div><div class="ch-s">${ch.s}</div></div><div class="ch-bd"><div class="cb">${ch.lead}</div><ul class="bl">${bH}</ul><div class="cl" style="border-color:${ch.a};background:${ch.al}">${ch.cl}</div><div class="yc" style="background:${ch.al};border-color:${ch.a}44"><div class="yc-t" style="color:${ch.a}">${L.yct}</div><ul class="yc-l" style="color:${ch.a}">${yH}</ul></div></div><div class="pnav"><button class="nb" onclick="go(${idx-1})">${L.back}</button><span class="pi">${idx}/${L.chapters.length}</span><button class="nb" onclick="go(${idx+1})">${L.next}</button></div></div>`;
    c.appendChild(p);
  });

  // Stamp
  const si=L.chapters.length+1;
  const sp=document.createElement('div');
  sp.className='pg'+(curPage===si?' on':'');
  const sH=L.stamps.map((s,i)=>`<div class="si${stampStates[curLang][i]?' on':''}" id="s${i}" onclick="ts(${i})"><span class="sc">✓</span><span class="se">${['👟','🗑️','🤫','🙏','🌍','💛'][i]}</span><span class="sl">${s}</span></div>`).join('');
  sp.innerHTML=`<div class="card"><div class="sp"><div class="sp-l">${L.stampLabel}</div><div class="sp-h">${L.stampH}</div><button class="more-btn" onclick="goDetail()">${L.moreBtn}</button><div class="sp-s">${L.stampS}</div><div class="sg">${sH}</div><div class="sr${stampStates[curLang].every(Boolean)?' on':''}" id="sr"><div class="sr-t">${L.certT}</div><div class="sr-n">${L.certN}</div><div class="sr-m">${L.certM}</div></div></div><div class="pnav"><button class="nb" onclick="go(${si-1})">${L.back}</button><span class="pi">${L.stampNav}</span><button class="nb" onclick="go(${si+1})">${L.toEnd}</button></div></div>`;
  c.appendChild(sp);

  // Final
  const fi=L.chapters.length+2;
  const fp=document.createElement('div');
  fp.className='pg'+(curPage===fi?' on':'');
  const kwH=L.keywords.map(k=>`<span class="kw">${k}</span>`).join('');
  fp.innerHTML=`<div class="fp"><div class="fp-l">${L.finalLabel}</div><div class="fp-t">${L.finalTitle.replace(/\n/,'<br>')}</div><div class="fp-e">${L.finalEn}</div><div class="fp-div"></div><p class="fp-p">${L.finalP.replace(/\n/g,'<br>')}</p><div class="kr">${kwH}</div><div class="ig">${L.ichiGo}</div><div class="fp-nav"><button class="nb-inv" onclick="go(${fi-1})">${L.back}</button><button class="nb-inv" onclick="go(0)">${L.toStart}</button></div></div>`;
  c.appendChild(fp);
}

function renderDetail(L,c){
  const wrap=document.createElement('div');
  wrap.className='pg on';
  let sectionsHTML=L.details.map((d,di)=>{
    const itemsHTML=d.items.map(it=>`<li><span class="tag ${it.tag==='NG'||it.tag==='禁止'||it.tag==='Never'||it.tag==='금지'?'ng':it.tag==='OK'||it.tag==='可以'||it.tag==='가능'?'ok':''}">${it.tag}</span><span>${it.text}</span></li>`).join('');
    const boxesHTML=(d.boxes||[]).map(b=>`<div class="dg-box ${b.type}">${b.text.replace(/\n/g,'<br>')}</div>`).join('');
    const phrasesHTML=d.phrases?`<div class="phrase-grid">${d.phrases.map(ph=>`<div class="phrase-card"><div class="phrase-jp">${ph.jp}</div><div class="phrase-ro">${ph.ro}</div><div class="phrase-en">${ph.en}</div></div>`).join('')}</div>`:'';
    return `<div class="dg-section"><button class="dg-acc" onclick="toggleAcc(this)"><span class="dg-acc-t"><span class="dg-acc-icon">${d.icon}</span>${d.title}</span><span class="dg-arrow">▼</span></button><div class="dg-content"><p class="dg-lead">${d.lead}</p><ul class="dg-items">${itemsHTML}</ul>${boxesHTML}${phrasesHTML}</div></div>`;
  }).join('');

  wrap.innerHTML=`<div class="dg-wrap"><div class="dg-hd"><div class="dg-hd-t">🗺️ ${L.detailTitle}</div><div class="dg-hd-s">${L.detailSub}</div></div><div class="dg-body">${sectionsHTML}</div><div class="dg-nav"><button class="nb" onclick="backFromDetail()">${L.detailBack}</button><span class="pi">8 topics</span></div></div>`;
  c.appendChild(wrap);
}

renderAll();
</script>
</body>
</html>
